{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechRepair — Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/login.css' %}">
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-ic"><i class="bi bi-cpu-fill" style="color:#fff;font-size:1.4rem;"></i></div>
    <h1>TechRepair</h1>
    <p>Sistema de Gestión de Reparaciones</p>
  </div>

  {% if messages %}
  {% for msg in messages %}
  <div class="error" style="{% if msg.tags == 'warning' %}background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:#f5a623;{% endif %}">
    <i class="bi bi-{% if msg.tags == 'warning' %}clock-history{% else %}exclamation-triangle-fill{% endif %}"></i>
    {{ msg }}
  </div>
  {% endfor %}
  {% endif %}

  {% if error %}
  <div class="error"><i class="bi bi-exclamation-triangle-fill"></i>{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="fg">
      <label class="fl">Usuario</label>
      <input class="fc" type="text" name="username" autofocus>
    </div>
    <div class="fg">
      <label class="fl">Contraseña</label>
      <div style="position:relative;">
         <input class="fc" type="password" name="password" 
         id="password-input" placeholder="••••••••" style="padding-right:42px;">
        <button type="button" onclick="togglePassword()"
           style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
           background:none;border:none;cursor:pointer;color:var(--t3);font-size:1rem;
            padding:0;display:flex;align-items:center;">
        <i class="bi bi-eye-fill" id="eye-icon"></i>
       </button>
      </div>
      <script>
        function togglePassword() {
          const input = document.getElementById('password-input');
           const icon  = document.getElementById('eye-icon');
         if (input.type === 'password') {
            input.type = 'text';
             icon.className = 'bi bi-eye-slash-fill';
            } else {
              input.type = 'password';
               icon.className = 'bi bi-eye-fill';
           }
          }
</script>
    </div>
    <button class="btn" type="submit">
      <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
    </button>
  </form>

  <div class="hint">
    ¿Olvidaste tu contraseña? <span>Contacta al administrador</span>
  </div>
</div>
<script src="{% static 'core/js/transitions.js' %}"></script>
</body>
</html>
